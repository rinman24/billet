[project]
name = "billet"
description = "A stateless, configurable manager for Azure Hosts and the repos' devcontainer Workspaces that run on them."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Rich Inman, PhD" }]
license = "MIT"
license-files = ["LICENSE"]
dynamic = ["version"]
keywords = [
    "devcontainer",
    "azure",
    "ssh",
    "cloud-development",
    "host",
    "workspace",
    "claude",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "rich>=13",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/rinman24/billet"
Repository = "https://github.com/rinman24/billet"

[project.scripts]
billet = "billet.cli.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/billet/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/billet"]

# The Berth ships inside the wheel so `billet doctor` compares a Workspace against the
# templates of the billet actually installed, read through importlib.resources and never
# through a repo path (ADR-0015, D-A4-1). hatchling's editable install does NOT expose a
# force-included directory to `import billet` (the package resolves to src/billet, which has
# no _berth), so tests prove the resolver against a built wheel (tests/unit/test_packaging.py).
[tool.hatch.build.targets.wheel.force-include]
"templates/workspace" = "billet/_berth"

[tool.hatch.build.targets.sdist]
include = [
    "src/billet",
    "templates/workspace",
    "tests",
    "README.md",
    "CLAUDE.md",
    "LICENSE",
]

[dependency-groups]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]
dev = [
    "ruff>=0.11",
    "pyright>=1.1.390",
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "import-linter>=2.1",
    { include-group = "docs" },
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
extend-select = [
    "D",    # pydocstyle
    "PL",   # Pylint
    "I",    # isort (import sorting / grouping)
    "TID",  # flake8-tidy-imports (banned-api, import hygiene)
]

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true
known-first-party = ["billet", "tests"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# Test helpers often use non-imperative fixture docstrings; magic-value checks are noisy in tests.
"tests/*" = ["D100", "D103", "D401", "D205", "D209", "PLR2004", "PLR0913"]
# Empty package markers carry a one-line docstring but need no module-level docstring rule beyond it.
"**/__init__.py" = ["D104"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.11"
include = ["src", "tests"]
extraPaths = [".", "src"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: live, operator-run acceptance; skipped unless BILLET_INTEGRATION=1",
]

# Closed-architecture layering (Löwy volatility-based decomposition). Higher layers may
# import lower ones; never the reverse. `billet.contracts` holds the cross-layer data
# contracts + service Protocols (the HostProvider seam) so the access-layer implementation
# and the host-layer manager both depend on the abstraction without an upward import — see
# docs/adr/adr-0001-closed-architecture-decomposition.md. It sits above `infrastructure`
# so infrastructure stays pure (it cannot import domain contracts).
[tool.importlinter]
root_package = "billet"

[[tool.importlinter.contracts]]
name = "billet closed-architecture layers"
type = "layers"
layers = [
    "billet.cli",
    "billet.workspace",
    "billet.host",
    "billet.access",
    "billet.contracts",
    "billet.infrastructure",
    "billet.shared",
]

# Pure engines (ADR-0001; FA-8) depend only on `contracts` and `shared`. The layers contract
# above still lets `billet.workspace` import `access`/`host`/`infrastructure` (all lower), so
# this contract is what proves an engine — the Berth drift policy included — does no I/O by
# construction.
[[tool.importlinter.contracts]]
name = "pure workspace engines import only contracts and shared"
type = "forbidden"
source_modules = ["billet.workspace.engine"]
forbidden_modules = [
    "billet.cli",
    "billet.workspace.manager",
    "billet.host",
    "billet.access",
    "billet.infrastructure",
]

# ResourceAccess modules are peers (ADR-0001): one access module never reaches into another.
# `compose_script` is the one shared leaf — the devcontainer.json parser, the compose prelude
# and the running-service ps that `start` and `doctor` must agree on — so it is left out of the
# independence set (both container and doctor access import it) and kept a leaf by the
# forbidden contract below.
[[tool.importlinter.contracts]]
name = "access modules are independent (compose_script is the shared leaf)"
type = "independence"
modules = [
    "billet.access.container.compose_container_access",
    "billet.access.doctor",
    "billet.access.host",
    "billet.access.metrics",
    "billet.access.registry",
    "billet.access.secret",
    "billet.access.source",
    "billet.access.sshconfig",
]

[[tool.importlinter.contracts]]
name = "the shared compose_script leaf imports no other access module"
type = "forbidden"
source_modules = ["billet.access.container.compose_script"]
forbidden_modules = [
    "billet.access.container.compose_container_access",
    "billet.access.doctor",
    "billet.access.host",
    "billet.access.metrics",
    "billet.access.registry",
    "billet.access.secret",
    "billet.access.source",
    "billet.access.sshconfig",
]
