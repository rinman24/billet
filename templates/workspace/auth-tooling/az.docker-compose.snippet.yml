# Optional auth-tooling recipe — the Azure CLI (`az`), volume part (its Locker).
#
# Merge into the repo's .devcontainer/docker-compose.yml ONLY if this Workspace actually
# calls `az`, together with az.Dockerfile.snippet (the binary part). Replace <service>
# with the compose service devcontainer.json names; keep the volume name's
# `_azure_home` suffix — it is the canonical Locker name billet's tests and docs use.

services:
  <service>:
    volumes:
      # Persist the `az login` (Entra) refresh token so Azure paperwork stays keyless
      # across a `compose up --build`. The credential is the operator's, not the image's,
      # so it belongs on a volume rather than baked in. The image need not pre-create the
      # mountpoint: the Berth entrypoint re-owns a root-owned, empty Locker to `dev` at
      # container start (ADR-0013).
      - <service>_azure_home:/home/dev/.azure

volumes:
  <service>_azure_home:
