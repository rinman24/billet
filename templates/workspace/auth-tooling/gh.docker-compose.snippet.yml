# Optional auth-tooling recipe — the GitHub CLI (`gh`), volume part (its Locker).
#
# Merge into the repo's .devcontainer/docker-compose.yml ONLY if this Workspace actually
# calls `gh`, together with gh.Dockerfile.snippet (the binary part). Replace <service>
# with the compose service devcontainer.json names; keep the volume key `gh_config` as
# shipped — it is the canonical Locker key. The key is bare because the compose project,
# named for the Workspace, supplies the namespace (ADR-0017): on the Host the volume is
# `<workspace-key>_gh_config`.

services:
  <service>:
    volumes:
      # Persist the `gh` credential store (hosts.yml) so a `compose up --build` does not
      # force `gh auth login` again. The token is the operator's, not the image's, so it
      # belongs on a volume rather than baked in. The image need not pre-create the
      # mountpoint: the Berth entrypoint re-owns a root-owned, empty Locker to `dev` at
      # container start (ADR-0013). Note the token is stored in plain text here, as `gh`
      # itself warns — the volume is as private as the Host it lives on.
      - gh_config:/home/dev/.config/gh

volumes:
  gh_config:
